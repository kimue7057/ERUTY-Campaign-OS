name: PR 1 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: eruty_test
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: eruty_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eruty_test:ci_local_only@127.0.0.1:5432/eruty_test
      TEST_DATABASE_URL: postgresql://eruty_test:ci_local_only@127.0.0.1:5432/eruty_test
      AUTH_MODE: disabled
      ALLOW_DEMO_AUTH: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr1-ui-evidence
          path: |
            docs/screenshots/
            playwright-report/
